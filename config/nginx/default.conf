# Servidor estático do simulador (montado em /etc/nginx/conf.d/default.conf).
# Imagem nginx-unprivileged: roda como usuário sem privilégios, por isso escuta na 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Cabeçalhos de segurança. Tudo, inclusive as fontes, vem do próprio site: nenhum domínio externo.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    # Arquivos ocultos (.git, .env etc.) nunca são servidos.
    location ~ /\. {
        deny all;
    }
}
